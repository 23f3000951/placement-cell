<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register Form</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        #canvas{
            height:750px;
            margin:auto;
            margin-top:5%;
            margin-bottom:5%;
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="canvas" class="p-4">
            <h1 class="text-center">Register Form</h1>
            <form action="/register" method="post" >
               <div class="mb-3 fs-5">
                    <label for="username" class="form-label">Username</label>                        
                    <input type="text" class="form-control" id="username" name="username">
                </div>
                <div class="mb-3 fs-5">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email">
                </div>                   
                <div class="mb-3 fs-5">
                    <label for="Password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="Password" name="password">
                </div>
                <div class="mb-3 fs-5">
                    <label for="role" class="form-label">Register As</label>
                    <select class="form-select" id="role" name="role" required>
                        <option value="student">Student</option>
                        <option value="company">Company</option>
                    </select>
                </div>
                <div class="mb-3 fs-5">
                    <label for="department" class="form-label">Student Department</label>
                    <input type="text" class="form-control" name="department" id="department" placeholder="Only for Students (e.g. CS, IT). Companies leave blank.">
                </div>
                <div class="mb-3 fs-5">
                    <label for="overview" class="form-label">Company Overview</label>
                    <textarea class="form-control" name="overview" id="overview" placeholder="Only for Companies. Students leave blank."></textarea>
                </div>
                <div class="text-center">
                    <input type="submit" class="btn btn-primary" value="Register"><br>
                    Already registered?<a href="/login">Login</a>
                </div>                
            </form>
        </div>
    </div>
</body>
</html>
