<!DOCTYPE html>
<html lang="en">
<head>
    <title>Applications</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<style>
    #canvas{
        height:600px;
    }
</style>
<body>
    <div id="main">
        <div id="canvas">
            <div id="content">
                <h1 class="text-center">Update Applications for the Drive</h1>
                <h4 style="margin:28px;">Job Tittle :- {{ drive.job_title }}</h4>
                <h4 class="headings">Received Applications</h4>
                <div id="table">
                    <table class="table table-bordered" >
                        <thead>
                            <tr>
                                <th>Student Name</th>
                                <th style="width:30%" class="text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for app in applications %}
                            <tr>
                                <td>{{ app.student.name }}</td> 
                                <td class="text-center align-middle">
                                    <a class="btn btn-light" href="/student/application/review/{{ app.id }}" role="button">Review Application</a>
                                </td>
                            </tr>
                            {% else %}
                            <tr>
                                <td colspan="2" class="text-center">No Applications received yet.</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="text-center">
               <input type="submit" class="btn btn-primary" value="Save Info">
            </div>
        </div>
    </div>
</body>
</html>
