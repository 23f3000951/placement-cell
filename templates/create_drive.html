<!DOCTYPE html>
<html lang="en">
<head>
    <title>Create a Drive</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        #canvas{
            height:auto;
            margin:auto;
            margin-top:5%;
            margin-bottom:5%;
        }
        #main{
            height:auto;
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="canvas" class="p-4">
            <h1 class="text-center">Create a Drive</h1>
            <form action="/company/{{ company_id }}/create_drive" method="POST">
                <div class="mb-3">
                    <label for="DN" class="form-label">Drive Name</label>
                    <input type="text" class="form-control" id="DN" name="drive_name" required>
                </div>
                <div class="mb-3">
                    <label for="JT" class="form-label">Job Title</label>
                    <input type="text" class="form-control" id="JT" name="job_title" required>
                </div>
                <div class="mb-3">
                    <label for="JD" class="form-label">Job Description</label>
                    <textarea name="job_description" id="JD" class="form-control" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="EC" class="form-label">Eligibility Criteria</label>
                    <input type="text" class="form-control" id="EC" name="eligibility" required>
                </div>
                <div class="mb-3">
                    <label for="AD" class="form-label">Apllication Deadline</label>
                    <input type="date" class="form-control" id="AD" name="deadline" required>
                </div>
                <div class="mb-3">
                    <label for="salary" class="form-label">Salary</label>
                    <input type="number" class="form-control" id="salary" name="salary" >
                </div>
                <div class="mb-3">
                    <label for="location" class="form-label">Location</label>
                    <input type="text" class="form-control" id="location" name="location">
                </div>
                <div class="text-center">
                    <input type="submit" class="btn btn-primary" value="Save">
                </div>
            </form>
        </div>
    </div>
</body>
</html>
